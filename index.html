.shade{position:fixed;inset:0;background:linear-gradient(to top,rgba(2,10,5,.92) 0,rgba(2,10,5,0) 34%),linear-gradient(to bottom,rgba(2,10,5,.7) 0,rgba(2,10,5,0) 18%)}
.page{
  position:relative;z-index:1;height:100%;height:100dvh;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
}
header{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:700;font-size:1.25rem;letter-spacing:.02em}
header a{color:var(--muted);text-decoration:none;font-size:.9rem}
header a:hover,header a:focus-visible{color:var(--green)}
.join{
  width:100%;max-width:960px;margin:0 auto;
  display:flex;flex-direction:column;gap:14px;
  animation:rise .8s ease-out both;
}
.copy h1{margin:0 0 4px;font-size:1.5rem;font-weight:700;line-height:1.2}
.copy p{margin:0;color:var(--muted);font-size:.95rem;max-width:46ch;line-height:1.5}
form{display:flex;flex-direction:column;gap:10px}
input{
  font:inherit;font-size:.95rem;color:var(--ink);
  background:rgba(2,10,5,.72);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;min-width:0;width:100%;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
input::placeholder{color:#6f9a84}
input:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
button{
  font:inherit;font-weight:600;font-size:.95rem;cursor:pointer;
  color:#012010;background:var(--green);border:0;border-radius:12px;padding:14px 22px;
  box-shadow:0 0 24px rgba(45,255,148,.45);transition:transform .15s,box-shadow .15s;
}
button:hover{transform:translateY(-1px);box-shadow:0 0 34px rgba(45,255,148,.65)}
button:disabled{opacity:.6;cursor:default;transform:none}
.msg{min-height:1.2em;margin:0;font-size:.88rem}
.msg.err{color:#ff8f8f}.msg.ok{color:var(--green)}
@media (min-width:860px){
  .page{padding-left:40px;padding-right:40px}
  .join{flex-direction:row;align-items:center;justify-content:space-between;gap:32px}
  form{flex-direction:row;flex:1;max-width:560px}
  input{flex:1}
  button{white-space:nowrap}
  .msg{position:absolute;bottom:2px;left:0;right:0;text-align:center}
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.join{animation:none}button{transition:none}}
</style>
</head>
<body>
<div class="fill" aria-hidden="true"></div>
<div class="logo" role="img" aria-label="Verdex logo"></div>
<div class="shade" aria-hidden="true"></div>

<div class="page">
  <header>
    <span class="brand">Verdex</span>
    <a id="xlink" href="#" target="_blank" rel="noopener">Follow on X</a>
  </header>

  <main class="join">
    <div class="copy">
      <h1>Whitelist is open</h1>
      <p>Verdex isn't live yet. Add your details to get early access.</p>
    </div>
    <form id="wl" novalidate>
      <input id="x" name="x" type="text" placeholder="X username (@name)" autocomplete="off" aria-label="X username">
      <input id="w" name="wallet" type="text" placeholder="Wallet address" autocomplete="off" spellcheck="false" aria-label="Wallet address">
      <button id="b" type="submit">Join whitelist</button>
      <p id="m" class="msg" role="status" aria-live="polite"></p>
    </form>
  </main>
</div>

<script>
// ====== SETTINGS ======
// Paste your form endpoint here (Formspree, Google Apps Script, etc.). It receives a JSON POST: {x, wallet}.
var ENDPOINT = "";
var X_URL = "https://x.com/verdexhq";
// ======================
document.getElementById("xlink").href = X_URL;
var f = document.getElementById("wl"), m = document.getElementById("m"), b = document.getElementById("b");
function say(t, c){ m.textContent = t; m.className = "msg " + (c || ""); }
f.addEventListener("submit", function(e){
  e.preventDefault();
  var x = f.x.value.trim().replace(/^@/, ""), w = f.wallet.value.trim();
  if(!/^[A-Za-z0-9_]{1,15}$/.test(x)){ say("Enter a valid X username (letters, numbers, underscore).", "err"); return; }
  if(w.length < 26 || /\s/.test(w)){ say("Enter a valid wallet address with no spaces.", "err"); return; }
  b.disabled = true; say("Sending...");
  var done = function(){ f.reset(); say("You're on the whitelist.", "ok"); b.textContent = "Joined"; };
  if(!ENDPOINT){ try{ var l = JSON.parse(localStorage.getItem("wl") || "[]"); l.push({x:x, wallet:w}); localStorage.setItem("wl", JSON.stringify(l)); }catch(_){} done(); return; }
  fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body:JSON.stringify({x:x, wallet:w})})
    .then(function(r){ if(!r.ok) throw 0; done(); })
    .catch(function(){ b.disabled = false; say("Couldn't send. Check your connection and try again.", "err"); });
});
</script>
</body>
</html>
